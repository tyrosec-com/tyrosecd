# Reproduzierbarer Build: Pfade der Build-Umgebung nicht in die Programmdatei übernehmen (siehe VERIFY.md).
# Gilt für den offiziellen Build und für verify.sh gleichermaßen (Quellcode unter /src/agent, Ziel unter /target).
[build]
rustflags = [
    "--remap-path-prefix=/src/agent=tyrosecd",
    "--remap-path-prefix=/usr/local/cargo/registry/src=crates",
    "--remap-path-prefix=/usr/local/cargo/git/checkouts=git",
    "--remap-path-prefix=/target=target",
]
