# Reproducible build: do not embed paths of the build environment in the binary (see VERIFY.md).
# Applies equally to the official build and to verify.sh (source under /src/agent, target under /target).
[build]
rustflags = [
    "--remap-path-prefix=/src/agent=tyrosecd",
    "--remap-path-prefix=/usr/local/cargo/registry/src=crates",
    "--remap-path-prefix=/usr/local/cargo/git/checkouts=git",
    "--remap-path-prefix=/target=target",
]
