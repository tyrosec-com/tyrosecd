# tyrosecd – Agent (eigener Workspace, wird 1:1 als einsehbarer Quellcode veröffentlicht)
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "LicenseRef-tyrosec-Source-Review-1.0"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
md-5 = "0.10"
blake3 = "1"
hex = "0.4"
zstd = "0.13"
diffy = "0.4"
regex = "1"
globset = "0.4"
walkdir = "2"
libc = "0.2"
inotify = "0.11"
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", features = ["json"] }
rayon = "1"
base64 = "0.22"
tempfile = "3"
redb = "2"
ring = "0.17"
prost = "0.13"
toml = "0.8"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
webpki-roots = "0.26"
uuid = { version = "1", features = ["v4", "serde"] }
tyrosd-proto = { path = "crates/proto" }
tyrosd-transport = { path = "crates/transport" }
tyrosd-metrics = { path = "crates/metrics" }
tyrosd-source-auth = { path = "crates/source-auth" }
tyrosd-source-weblog = { path = "crates/source-weblog" }
tyrosd-inventory = { path = "crates/inventory" }
tyrosd-core = { path = "crates/core" }
tyrosd-source-scan = { path = "crates/source-scan" }
tyrosd-source-inotify = { path = "crates/source-inotify" }
tyrosd-source-fanotify = { path = "crates/source-fanotify" }
tyrosd-check = { path = "crates/check" }
tyrosd-yara = { path = "crates/yara" }
tyrosd-detect = { path = "crates/detect" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
