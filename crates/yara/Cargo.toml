[package]
name = "tyrosd-yara"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Load the YARA rule package and scan files (boreal, pure Rust)"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
zstd.workspace = true
# without "process" (process memory) and "memmap"; "object" for the pe/elf modules that rule files import
boreal = { version = "1.4", default-features = false, features = ["hash", "object"] }

[dev-dependencies]
tempfile.workspace = true
